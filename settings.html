<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Account Settings</title>

    <link
        rel="stylesheet"
        href="dashboardstyle.css"
    >

</head>

<body>

<div class="dashboard-page">


    <!-- =================================================
         HEADER
         ================================================= -->

    <header class="dashboard-header">

        <div class="brand">

            <div class="brand-name">
                Merchant Portal Development
            </div>

        </div>


        <!-- Account Menu -->

        <div class="account-container">

            <button
                id="accountButton"
                class="account-button"
                type="button"
                onclick="toggleAccountMenu()"
            >

                <span
                    class="account-initial"
                    aria-hidden="true"
                >

                    <svg
                        viewBox="0 0 24 24"
                        width="18"
                        height="18"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <circle
                            cx="12"
                            cy="8"
                            r="3.5"
                        ></circle>

                        <path
                            d="M5.5 20c.8-3.4 3.2-5.5 6.5-5.5s5.7 2.1 6.5 5.5"
                        ></path>

                    </svg>

                </span>


                <span
                    id="accountEmail"
                    class="account-email"
                >
                    —
                </span>


                <span class="account-chevron">
                    ▾
                </span>

            </button>


            <div
                id="accountMenu"
                class="account-menu"
            >

                <div class="account-menu-header">

                    <div class="account-menu-label">
                        Signed in as
                    </div>

                    <div
                        id="menuEmail"
                        class="account-menu-email"
                    >
                        —
                    </div>

                    <div
                        id="menuMerchantId"
                        class="account-menu-merchant-id"
                    >
                        —
                    </div>

                </div>


                <button
                    class="account-menu-item"
                    type="button"
                    onclick="goToDashboard()"
                >
                    Dashboard
                </button>


                <button
                    class="account-menu-item"
                    type="button"
                    onclick="logout()"
                >
                    Log Out
                </button>

            </div>

        </div>

    </header>


    <!-- =================================================
         MAIN
         ================================================= -->

    <main class="dashboard-main">


        <!-- =================================================
             PAGE HEADING
             ================================================= -->

        <div class="dashboard-heading">

            <div>

                <h1>
                    Account Settings
                </h1>

                <p>
                    Manage your merchant account settings.
                </p>

            </div>

        </div>


        <!-- =================================================
             SETTINGS CONTENT
             ================================================= -->

        <section class="dashboard-content">


            <!-- =================================================
                 SETTINGS CARD
                 ================================================= -->

            <section class="dashboard-card">

                <div class="card-header">

                    <div>

                        <h2>
                            Account
                        </h2>

                        <p>
                            Manage your account information and security.
                        </p>

                    </div>

                </div>


                <div class="settings-list">


                    <!-- Change Account Details -->

                    <button
                        class="settings-item"
                        type="button"
                        onclick="showComingSoon('Change Account Details')"
                    >

                        <div class="settings-item-content">

                            <div class="settings-item-title">
                                Change Account Details
                            </div>

                            <div class="settings-item-description">
                                Update your name, email address, and other account information.
                            </div>

                        </div>


                        <div
                            class="settings-item-arrow"
                            aria-hidden="true"
                        >
                            ›
                        </div>

                    </button>


                    <!-- Change Account Password -->

                    <button
                        class="settings-item"
                        type="button"
                        onclick="showComingSoon('Change Account Password')"
                    >

                        <div class="settings-item-content">

                            <div class="settings-item-title">
                                Change Account Password
                            </div>

                            <div class="settings-item-description">
                                Update your account password and security credentials.
                            </div>

                        </div>


                        <div
                            class="settings-item-arrow"
                            aria-hidden="true"
                        >
                            ›
                        </div>

                    </button>


                </div>

            </section>


        </section>

    </main>


    <!-- =================================================
         DEVELOPER BUTTON
         ================================================= -->

    <button
        id="developerButton"
        class="developer-button"
        type="button"
        onclick="openDeveloperResponse()"
    >
        Developer
    </button>

</div>


<!-- =================================================
     DEVELOPER RESPONSE MODAL
     ================================================= -->

<div
    id="developerModal"
    class="developer-modal"
    onclick="closeDeveloperResponse(event)"
>

    <div
        class="developer-modal-content"
        onclick="event.stopPropagation()"
    >

        <div class="developer-modal-header">

            <h2>
                Developer Response
            </h2>


            <button
                class="developer-close"
                type="button"
                onclick="closeDeveloperResponse()"
                aria-label="Close"
            >
                ×
            </button>

        </div>


        <div
            id="developerMeta"
            class="developer-meta"
        >
            No request information.
        </div>


        <pre id="developerResponseText">No response yet.</pre>

    </div>

</div>


<script src="dashboard.js"></script>

</body>

</html>
