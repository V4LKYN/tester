<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Account Settings</title>

    <link
        rel="stylesheet"
        href="dashboardstyle.css"
    >

    <style>

        /* =================================================
           SETTINGS PAGE
           ================================================= */

        .settings-back {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            margin-bottom: 24px;

            padding: 0;

            border: none;

            background: none;

            color: #5f6672;

            font-size: 14px;

            font-weight: 500;

            text-decoration: none;

            cursor: pointer;

            transition:
                color 0.15s ease;

        }


        .settings-back:hover {

            color: #1f2937;

        }


        .settings-back-arrow {

            font-size: 17px;

            line-height: 1;

        }


        .settings-card {

            overflow: hidden;

        }


        .settings-card-header {

            padding: 24px 28px;

            border-bottom: 1px solid #eceef1;

        }


        .settings-card-header h2 {

            margin: 0 0 5px;

        }


        .settings-card-header p {

            margin: 0;

            color: #6b7280;

        }


        .settings-list {

            display: flex;

            flex-direction: column;

        }


        .settings-item {

            display: flex;

            align-items: center;

            justify-content: space-between;

            width: 100%;

            padding: 22px 28px;

            border: none;

            border-bottom: 1px solid #eceef1;

            background: transparent;

            text-align: left;

            cursor: pointer;

            transition:
                background-color 0.15s ease;

        }


        .settings-item:last-child {

            border-bottom: none;

        }


        .settings-item:hover {

            background-color: #f8f9fb;

        }


        .settings-item-content {

            min-width: 0;

            padding-right: 24px;

        }


        .settings-item-title {

            margin-bottom: 5px;

            color: #1f2937;

            font-size: 15px;

            font-weight: 600;

        }


        .settings-item-description {

            color: #6b7280;

            font-size: 14px;

            line-height: 1.5;

        }


        .settings-item-arrow {

            flex-shrink: 0;

            color: #9aa1ab;

            font-size: 21px;

            line-height: 1;

            transition:
                color 0.15s ease,
                transform 0.15s ease;

        }


        .settings-item:hover .settings-item-arrow {

            color: #4b5563;

            transform: translateX(2px);

        }


        @media (max-width: 600px) {

            .settings-card-header {

                padding: 20px;

            }


            .settings-item {

                padding: 20px;

            }


            .settings-item-description {

                max-width: 95%;

            }

        }

    </style>

</head>


<body>

<div class="dashboard-page">


    <!-- =================================================
         HEADER
         ================================================= -->

    <header class="dashboard-header">

        <div class="brand">

            <div class="brand-name">
                Merchant Portal Development
            </div>

        </div>


        <!-- Account Menu -->

        <div class="account-container">

            <button
                id="accountButton"
                class="account-button"
                type="button"
                onclick="toggleAccountMenu()"
            >

                <span
                    class="account-initial"
                    aria-hidden="true"
                >

                    <svg
                        viewBox="0 0 24 24"
                        width="18"
                        height="18"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <circle
                            cx="12"
                            cy="8"
                            r="3.5"
                        ></circle>

                        <path
                            d="M5.5 20c.8-3.4 3.2-5.5 6.5-5.5s5.7 2.1 6.5 5.5"
                        ></path>

                    </svg>

                </span>


                <span
                    id="accountEmail"
                    class="account-email"
                >
                    —
                </span>


                <span class="account-chevron">
                    ▾
                </span>

            </button>


            <div
                id="accountMenu"
                class="account-menu"
            >

                <div class="account-menu-header">

                    <div class="account-menu-label">
                        Signed in as
                    </div>

                    <div
                        id="menuEmail"
                        class="account-menu-email"
                    >
                        —
                    </div>

                    <div
                        id="menuMerchantId"
                        class="account-menu-merchant-id"
                    >
                        —
                    </div>

                </div>


                <button
                    class="account-menu-item"
                    type="button"
                    onclick="goToSettings()"
                >
                    Account Settings
                </button>


                <button
                    class="account-menu-item"
                    type="button"
                    onclick="logout()"
                >
                    Log Out
                </button>

            </div>

        </div>

    </header>


    <!-- =================================================
         MAIN
         ================================================= -->

    <main class="dashboard-main">


        <!-- =================================================
             PAGE HEADING
             ================================================= -->

        <div class="dashboard-heading">

            <div>

                <h1>
                    Account Settings
                </h1>

                <p>
                    Manage your merchant account settings.
                </p>

            </div>

        </div>


        <!-- =================================================
             SETTINGS CONTENT
             ================================================= -->

        <section class="dashboard-content">


            <!-- Back to Dashboard -->

            <button
                class="settings-back"
                type="button"
                onclick="goToDashboard()"
            >

                <span
                    class="settings-back-arrow"
                    aria-hidden="true"
                >
                    ←
                </span>

                <span>
                    Dashboard
                </span>

            </button>


            <!-- Account Settings Card -->

            <section class="dashboard-card settings-card">


                <!-- Card Header -->

                <div class="settings-card-header">

                    <h2>
                        Account
                    </h2>

                    <p>
                        Manage your account information and security.
                    </p>

                </div>


                <!-- Settings Options -->

                <div class="settings-list">


                    <!-- Account Details -->

                    <button
                        class="settings-item"
                        type="button"
                        onclick="showComingSoon('Change Account Details')"
                    >

                        <div class="settings-item-content">

                            <div class="settings-item-title">
                                Change Account Details
                            </div>

                            <div class="settings-item-description">
                                Update your name, email address, and other account information.
                            </div>

                        </div>


                        <span
                            class="settings-item-arrow"
                            aria-hidden="true"
                        >
                            ›
                        </span>

                    </button>


                    <!-- Account Password -->

                    <button
                        class="settings-item"
                        type="button"
                        onclick="showComingSoon('Change Account Password')"
                    >

                        <div class="settings-item-content">

                            <div class="settings-item-title">
                                Change Account Password
                            </div>

                            <div class="settings-item-description">
                                Update your account password and security credentials.
                            </div>

                        </div>


                        <span
                            class="settings-item-arrow"
                            aria-hidden="true"
                        >
                            ›
                        </span>

                    </button>

                </div>

            </section>

        </section>

    </main>


    <!-- =================================================
         DEVELOPER BUTTON
         ================================================= -->

    <button
        id="developerButton"
        class="developer-button"
        type="button"
        onclick="openDeveloperResponse()"
    >
        Developer
    </button>

</div>


<!-- =================================================
     DEVELOPER RESPONSE MODAL
     ================================================= -->

<div
    id="developerModal"
    class="developer-modal"
    onclick="closeDeveloperResponse(event)"
>

    <div
        class="developer-modal-content"
        onclick="event.stopPropagation()"
    >

        <div class="developer-modal-header">

            <h2>
                Developer Response
            </h2>


            <button
                class="developer-close"
                type="button"
                onclick="closeDeveloperResponse()"
                aria-label="Close"
            >
                ×
            </button>

        </div>


        <div
            id="developerMeta"
            class="developer-meta"
        >
            No request information.
        </div>


        <pre id="developerResponseText">No response yet.</pre>

    </div>

</div>


<script src="dashboard.js"></script>

</body>

</html>
